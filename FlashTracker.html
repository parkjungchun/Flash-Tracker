<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flash Tracker</title>
<link id="apple-touch-icon" rel="apple-touch-icon">
<script>
(function(){
  var c = document.createElement('canvas');
  c.width = 180; c.height = 180;
  var ctx = c.getContext('2d');
  ctx.fillStyle = '#0D1B2A';
  ctx.fillRect(0, 0, 180, 180);
  ctx.font = '120px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('\u26A1', 90, 95);
  document.getElementById('apple-touch-icon').href = c.toDataURL('image/png');
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C8AA6E;
    --gold-light: #F0E6D3;
    --gold-dark: #785A28;
    --bg: #0D1B2A;
    --panel: #162436;
    --panel2: #1A2D42;
    --border: #2A3E54;
    --red: #C34B4B;
    --green: #3D9970;
    --white: #F0E6D3;
    --ready: #00E5FF;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--white);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 12px 48px;
  }

  .header {
    text-align: center;
    margin-bottom: 28px;
    width: 100%;
    max-width: 560px;
  }
  .header h1 {
    font-size: 1.05rem;
    font-weight: 900;
    color: var(--gold);
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .header p {
    font-size: 0.68rem;
    color: #6A8AA0;
    margin-top: 3px;
    letter-spacing: 0.06em;
  }

  .lanes-grid {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .lane-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 11px 14px;
    transition: border-color 0.2s;
  }
  .lane-card.cooling { border-color: var(--gold-dark); }
  .lane-card.ready {
    border-color: var(--ready);
    animation: readyPulse 1.5s ease-in-out infinite;
  }
  @keyframes readyPulse {
    0%, 100% { box-shadow: 0 0 6px rgba(0,229,255,0.08); }
    50%       { box-shadow: 0 0 14px rgba(0,229,255,0.22); }
  }

  .lane-top {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .lane-label {
    font-size: 0.7rem;
    color: #A0B8CC;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    width: 30px;
    flex-shrink: 0;
  }

  .time-fields {
    display: flex;
    align-items: center;
    gap: 1px;
  }
  /* text input으로 변경 — 2자리 제한 */
  .t-input {
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--gold-light);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 1.0rem;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    width: 34px;
    text-align: center;
    border-radius: 3px;
    padding: 5px 2px;
    outline: none;
    transition: border-color 0.15s;
  }
  .t-input:focus { border-color: var(--gold); }
  .t-colon {
    font-size: 1rem;
    font-weight: 900;
    color: #7A9AB0;
    padding: 0 2px;
  }

  .confirm-btn {
    background: linear-gradient(135deg, #1E4A7A, #163560);
    border: 1px solid #4A7AB0;
    color: #FFFFFF;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 700;
    font-size: 0.7rem;
    padding: 6px 10px;
    border-radius: 3px;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: all 0.15s;
    white-space: nowrap;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  .confirm-btn:hover {
    border-color: #6AACF0;
    background: linear-gradient(135deg, #2A5E9A, #1E4A7A);
  }

  .lane-result {
    flex: 1;
    text-align: right;
    min-width: 0;
  }
  .result-main {
    font-size: 0.9rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: #5A7A8A;
  }
  .result-main.cooling { color: var(--gold-light); }
  .result-sub {
    font-size: 0.62rem;
    color: #7A9AB0;
    margin-top: 2px;
    font-variant-numeric: tabular-nums;
  }
  .result-sub.active { color: #A07840; }

  .lane-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 8px;
  }

  .rune-pills { display: flex; gap: 4px; }

  .rune-pill {
    background: transparent;
    border: 1px solid #3A5068;
    color: #7A9AB0;
    font-size: 0.62rem;
    padding: 3px 9px;
    border-radius: 20px;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 700;
    transition: all 0.15s;
    letter-spacing: 0.03em;
    white-space: nowrap;
  }
  .rune-pill:hover {
    border-color: #4A7AB0;
    color: #A0C8F0;
    background: rgba(30,74,122,0.2);
  }
  .rune-pill.on {
    background: linear-gradient(135deg, #1E4A7A, #163560);
    border-color: #6AACF0;
    color: #FFFFFF;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }

  .cancel-btn {
    background: transparent;
    border: 1px solid #5A3030;
    color: #9A5050;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.62rem;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 3px;
    cursor: pointer;
    letter-spacing: 0.03em;
    transition: all 0.15s;
    display: none;
  }
  .cancel-btn:hover { border-color: var(--red); color: var(--red); }
  .cancel-btn.visible { display: block; }

  .progress-bar-wrap {
    margin-top: 8px;
    height: 2px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    display: none;
  }
  .progress-bar-fill {
    height: 100%;
    width: 100%;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--gold-dark), var(--gold));
  }

  .copy-section {
    width: 100%;
    max-width: 560px;
    margin-top: 10px;
  }
  .copy-preview {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 10px 14px;
    font-size: 0.82rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.06em;
    line-height: 1.6;
    user-select: all;
    cursor: text;
  }
  .slot-dim    { color: #4A6A80; }
  .slot-active { color: var(--gold-light); }

  .reset-btn {
    width: 100%;
    max-width: 560px;
    margin-top: 6px;
    background: transparent;
    border: 1px solid #3A5068;
    color: #6A8AA0;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.7rem;
    font-weight: 700;
    padding: 8px;
    border-radius: 3px;
    cursor: pointer;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    transition: all 0.15s;
  }
  .reset-btn:hover { color: var(--white); border-color: #8AAAC0; }
</style>
</head>
<body>

<div class="header">
  <h1>Flash Tracker</h1>
  <p>점멸 쿨타임 트래커</p>
</div>

<div class="lanes-grid" id="lanesGrid"></div>

<div class="copy-section">
  <div class="copy-preview" id="copyPreview"></div>
</div>
<button class="reset-btn" onclick="resetAll()">초기화</button>

<script>
const LANES = [
  { id: 'top',    name: '탑',   short: 'top' },
  { id: 'jungle', name: '정글', short: 'jug' },
  { id: 'mid',    name: '미드', short: 'mid' },
  { id: 'adc',    name: '원딜', short: 'ad'  },
  { id: 'sup',    name: '서폿', short: 'sup' },
];
// 쿨타임(초): 기본300 / 장화272 / 통찰254 / 둘다234
const CD = { base: 300, boots: 272, insight: 254, both: 234 };

const state = {};
LANES.forEach(l => {
  state[l.id] = { boots: false, insight: false, usedAt: null, readyAt: null, status: 'idle', realStartAt: null, cdSec: 0 };
});

function getCd(id) {
  const s = state[id];
  if (s.boots && s.insight) return CD.both;
  if (s.boots) return CD.boots;
  if (s.insight) return CD.insight;
  return CD.base;
}

function fmt(sec) {
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60).toString().padStart(2, '0');
  const s = (sec % 60).toString().padStart(2, '0');
  if (h > 0) return `${h}:${m}:${s}`;
  return `${m}:${s}`;
}

// 입력값을 초로 변환 (시:분:초)
function getInputSec(laneId) {
  const hVal = parseInt(document.getElementById(`hr-${laneId}`).value) || 0;
  const mVal = parseInt(document.getElementById(`min-${laneId}`).value) || 0;
  const sVal = Math.min(59, parseInt(document.getElementById(`sec-${laneId}`).value) || 0);
  return hVal * 3600 + mVal * 60 + sVal;
}

function applyFlash(laneId) {
  const usedAt = getInputSec(laneId);
  const cd = getCd(laneId);
  const ls = state[laneId];
  ls.usedAt = usedAt;
  ls.readyAt = usedAt + cd;
  ls.status = 'cooling';
  ls.realStartAt = Date.now();
  ls.cdSec = cd;
  renderAll();
}

function cancelFlash(laneId) {
  const ls = state[laneId];
  ls.usedAt = null;
  ls.readyAt = null;
  ls.status = 'idle';
  ls.realStartAt = null;
  ls.cdSec = 0;
  document.getElementById(`hr-${laneId}`).value = '';
  document.getElementById(`min-${laneId}`).value = '';
  document.getElementById(`sec-${laneId}`).value = '';
  renderAll();
}

function resetAll() {
  LANES.forEach(l => {
    state[l.id].boots = false;
    state[l.id].insight = false;
    state[l.id].usedAt = null;
    state[l.id].readyAt = null;
    state[l.id].status = 'idle';
    state[l.id].realStartAt = null;
    state[l.id].cdSec = 0;
    document.getElementById(`hr-${l.id}`).value = '';
    document.getElementById(`min-${l.id}`).value = '';
    document.getElementById(`sec-${l.id}`).value = '';
    document.getElementById(`pill-${l.id}-boots`).classList.remove('on');
    document.getElementById(`pill-${l.id}-insight`).classList.remove('on');
    updatePillLabels(l.id);
  });
  renderAll();
}

function toggleRune(laneId, rune) {
  state[laneId][rune] = !state[laneId][rune];
  document.getElementById(`pill-${laneId}-${rune}`).classList.toggle('on', state[laneId][rune]);
  const ls = state[laneId];
  if (ls.usedAt !== null) {
    ls.readyAt = ls.usedAt + getCd(laneId);
  }
  updatePillLabels(laneId);
  renderAll();
}

// 장화/통찰 버튼에 적용 CD 초 표시
function updatePillLabels(laneId) {
  const s = state[laneId];

  // 장화: 단독 272초, 통찰도 켜져있으면 둘다 234초
  const bootsCd  = s.insight ? CD.both : CD.boots;
  const insightCd = s.boots  ? CD.both : CD.insight;

  const bBtn = document.getElementById(`pill-${laneId}-boots`);
  const iBtn = document.getElementById(`pill-${laneId}-insight`);

  bBtn.textContent  = s.boots  ? `장화 ${bootsCd}초`   : `장화 ${CD.boots}초`;
  iBtn.textContent  = s.insight ? `통찰 ${insightCd}초` : `통찰 ${CD.insight}초`;
}

function renderAll() {
  LANES.forEach(l => renderLane(l));
  renderCopy();
}

function renderLane(lane) {
  const ls = state[lane.id];
  const card       = document.getElementById(`card-${lane.id}`);
  const resultMain = document.getElementById(`result-main-${lane.id}`);
  const resultSub  = document.getElementById(`result-sub-${lane.id}`);
  const bar        = document.getElementById(`bar-${lane.id}`);
  const cancelBtn  = document.getElementById(`cancel-${lane.id}`);
  const cd = getCd(lane.id);

  // 실제 경과시간으로 남은 시간 계산 및 자동 초기화
  if (ls.status === 'cooling' && ls.realStartAt !== null) {
    const elapsed = Math.floor((Date.now() - ls.realStartAt) / 1000);
    const remaining = ls.cdSec - elapsed;
    if (remaining <= 0) {
      // 쿨타임 완료 → 자동 초기화
      ls.usedAt = null;
      ls.readyAt = null;
      ls.status = 'idle';
      ls.realStartAt = null;
      ls.cdSec = 0;
      document.getElementById(`hr-${lane.id}`).value = '';
      document.getElementById(`min-${lane.id}`).value = '';
      document.getElementById(`sec-${lane.id}`).value = '';
    } else {
      // 진행 중: 남은 시간 & 프로그레스바 업데이트
      card.className = 'lane-card cooling';
      resultMain.className = 'result-main cooling';
      resultMain.textContent = fmt(remaining) + ' 남음';
      resultSub.className = 'result-sub active';
      resultSub.textContent = `${fmt(ls.usedAt)} 사용 · CD ${ls.cdSec}초`;
      bar.style.display = 'block';
      const pct = ((ls.cdSec - remaining) / ls.cdSec * 100).toFixed(1);
      bar.querySelector('.progress-bar-fill').style.width = pct + '%';
      cancelBtn.classList.add('visible');
      return;
    }
  }

  card.className = 'lane-card' + (ls.status === 'idle' ? '' : ' ' + ls.status);

  if (ls.status === 'idle') {
    resultMain.className = 'result-main';
    resultMain.textContent = '–';
    resultSub.className = 'result-sub';
    resultSub.textContent = `CD ${cd}초`;
    bar.style.display = 'none';
    bar.querySelector('.progress-bar-fill').style.width = '100%';
    cancelBtn.classList.remove('visible');
  }
}

function renderCopy() {
  const preview = document.getElementById('copyPreview');
  preview.innerHTML = LANES.map(l => {
    const ls = state[l.id];
    if (ls.status !== 'idle') {
      return `<span class="slot-active">${l.short} ${fmt(ls.readyAt)}</span>`;
    } else {
      return `<span class="slot-dim">${l.short} --:--</span>`;
    }
  }).join(' ');
}

// 숫자만, 최대 2자리 입력 제한
function limitInput(el, max) {
  el.addEventListener('input', () => {
    el.value = el.value.replace(/\D/g, '').slice(0, 2);
    if (max !== null && parseInt(el.value) > max) el.value = String(max).padStart(2,'0');
  });
}

function buildLanes() {
  const grid = document.getElementById('lanesGrid');
  LANES.forEach(lane => {
    const card = document.createElement('div');
    card.className = 'lane-card';
    card.id = `card-${lane.id}`;

    card.innerHTML = `
      <div class="lane-top">
        <div class="lane-label">${lane.name}</div>
        <div class="time-fields">
          <input class="t-input" id="hr-${lane.id}"  inputmode="numeric" placeholder="00" maxlength="2">
          <span class="t-colon">:</span>
          <input class="t-input" id="min-${lane.id}" inputmode="numeric" placeholder="00" maxlength="2">
          <span class="t-colon">:</span>
          <input class="t-input" id="sec-${lane.id}" inputmode="numeric" placeholder="00" maxlength="2">
        </div>
        <button class="confirm-btn" onclick="applyFlash('${lane.id}')">입력</button>
        <div class="lane-result">
          <div class="result-main" id="result-main-${lane.id}">–</div>
          <div class="result-sub" id="result-sub-${lane.id}">CD ${CD.base}초</div>
        </div>
      </div>
      <div class="lane-bottom">
        <div class="rune-pills">
          <button class="rune-pill" id="pill-${lane.id}-boots"   onclick="toggleRune('${lane.id}','boots')">장화 ${CD.boots}초</button>
          <button class="rune-pill" id="pill-${lane.id}-insight" onclick="toggleRune('${lane.id}','insight')">통찰 ${CD.insight}초</button>
        </div>
        <button class="cancel-btn" id="cancel-${lane.id}" onclick="cancelFlash('${lane.id}')">취소</button>
      </div>
      <div class="progress-bar-wrap" id="bar-${lane.id}">
        <div class="progress-bar-fill"></div>
      </div>
    `;

    grid.appendChild(card);

    setTimeout(() => {
      const hrEl  = document.getElementById(`hr-${lane.id}`);
      const minEl = document.getElementById(`min-${lane.id}`);
      const secEl = document.getElementById(`sec-${lane.id}`);

      limitInput(hrEl,  99);
      limitInput(minEl, 59);
      limitInput(secEl, 59);

      hrEl.addEventListener('keydown', e => {
        if (e.key === 'Enter') minEl.focus();
      });
      minEl.addEventListener('keydown', e => {
        if (e.key === 'Enter') secEl.focus();
      });
      secEl.addEventListener('keydown', e => {
        if (e.key === 'Enter') applyFlash(lane.id);
      });

      // 2자리 입력 시 다음 칸으로 자동 이동
      hrEl.addEventListener('input', () => { if (hrEl.value.length === 2) minEl.focus(); });
      minEl.addEventListener('input', () => { if (minEl.value.length === 2) secEl.focus(); });
    }, 0);
  });
}

buildLanes();
renderAll();

// 1초마다 카운트다운 갱신
setInterval(() => { renderAll(); }, 1000);
</script>

</body>
</html>
