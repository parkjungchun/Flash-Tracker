<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flash Tracker</title>
<link id="apple-touch-icon" rel="apple-touch-icon">
<script>
(function(){
  var c = document.createElement('canvas');
  c.width = 180; c.height = 180;
  var ctx = c.getContext('2d');
  ctx.fillStyle = '#0D1B2A';
  ctx.fillRect(0, 0, 180, 180);
  ctx.font = '120px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('\u26A1', 90, 95);
  document.getElementById('apple-touch-icon').href = c.toDataURL('image/png');
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C8AA6E;
    --gold-light: #F0E6D3;
    --gold-dark: #785A28;
    --bg: #0D1B2A;
    --panel: #162436;
    --panel2: #1A2D42;
    --border: #2A3E54;
    --red: #C34B4B;
    --green: #3D9970;
    --white: #F0E6D3;
    --ready: #00E5FF;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--white);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 8px 32px;
  }

  .header {
    text-align: center;
    margin-bottom: 14px;
    width: 100%;
    max-width: 320px;
  }
  .header h1 {
    font-size: 0.9rem;
    font-weight: 900;
    color: var(--gold);
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .header p {
    font-size: 0.6rem;
    color: #6A8AA0;
    margin-top: 2px;
    letter-spacing: 0.06em;
  }

  .lanes-grid {
    width: 100%;
    max-width: 320px;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .lane-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 8px 10px;
    transition: border-color 0.2s;
  }
  .lane-card.cooling { border-color: var(--gold-dark); }
  .lane-card.ready {
    border-color: var(--ready);
    animation: readyPulse 1.5s ease-in-out infinite;
  }
  @keyframes readyPulse {
    0%, 100% { box-shadow: 0 0 6px rgba(0,229,255,0.08); }
    50%       { box-shadow: 0 0 14px rgba(0,229,255,0.22); }
  }

  /* 상단: 라벨 + 입력 + 버튼 한 줄 */
  .lane-top {
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .lane-label {
    font-size: 0.65rem;
    color: #A0B8CC;
    letter-spacing: 0.08em;
    width: 22px;
    flex-shrink: 0;
  }

  .time-fields {
    display: flex;
    align-items: center;
    gap: 0px;
  }
  .t-input {
    background: var(--panel2);
    border: 1px solid var(--border);
    color: var(--gold-light);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.85rem;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    width: 26px;
    text-align: center;
    border-radius: 3px;
    padding: 4px 1px;
    outline: none;
    transition: border-color 0.15s;
  }
  .t-input:focus { border-color: var(--gold); }
  .t-colon {
    font-size: 0.85rem;
    font-weight: 900;
    color: #7A9AB0;
    padding: 0 1px;
  }

  .confirm-btn {
    background: linear-gradient(135deg, #1E4A7A, #163560);
    border: 1px solid #4A7AB0;
    color: #FFFFFF;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 700;
    font-size: 0.62rem;
    padding: 4px 7px;
    border-radius: 3px;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: all 0.15s;
    white-space: nowrap;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  .confirm-btn:hover {
    border-color: #6AACF0;
    background: linear-gradient(135deg, #2A5E9A, #1E4A7A);
  }

  /* 지금 버튼 스타일 */
  .now-btn {
    background: linear-gradient(135deg, #785A28, #A07840);
    border: 1px solid var(--gold);
    color: var(--gold-light);
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 700;
    font-size: 0.62rem;
    padding: 4px 6px;
    border-radius: 3px;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: all 0.15s;
    white-space: nowrap;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  .now-btn:hover {
    background: linear-gradient(135deg, #A07840, #C8AA6E);
    color: #FFFFFF;
    border-color: var(--gold-light);
  }

  .lane-result {
    flex: 1;
    text-align: right;
    min-width: 0;
  }
  .result-main {
    font-size: 0.8rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: #5A7A8A;
    white-space: nowrap;
  }
  .result-main.cooling { color: var(--gold-light); }
  .result-sub {
    font-size: 0.55rem;
    color: #7A9AB0;
    margin-top: 1px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .result-sub.active { color: #A07840; }

  .lane-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 6px;
  }

  .rune-pills { display: flex; gap: 3px; flex-wrap: wrap; }

  .rune-pill {
    background: transparent;
    border: 1px solid #3A5068;
    color: #7A9AB0;
    font-size: 0.55rem;
    padding: 2px 6px;
    border-radius: 20px;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 700;
    transition: all 0.15s;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .rune-pill:hover {
    border-color: #4A7AB0;
    color: #A0C8F0;
    background: rgba(30,74,122,0.2);
  }
  .rune-pill.on {
    background: linear-gradient(135deg, #1E4A7A, #163560);
    border-color: #6AACF0;
    color: #FFFFFF;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }

  .cancel-btn {
    background: transparent;
    border: 1px solid #5A3030;
    color: #9A5050;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.62rem;
    font-weight: 700;
    padding: 4px 7px;
    border-radius: 3px;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: all 0.15s;
    white-space: nowrap;
    visibility: hidden;
    width: 0;
    padding: 0;
    border: none;
    overflow: hidden;
  }
  .cancel-btn:hover { border-color: var(--red); color: var(--red); }
  .cancel-btn.visible {
    visibility: visible;
    width: auto;
    padding: 4px 7px;
    border: 1px solid #5A3030;
  }

  .progress-bar-wrap {
    margin-top: 6px;
    height: 2px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    display: none;
  }
  .progress-bar-fill {
    height: 100%;
    width: 100%;
    border-radius: 2px;
    background: linear-gradient(90deg, var(--gold-dark), var(--gold));
  }

  .copy-section {
    width: 100%;
    max-width: 320px;
    margin-top: 8px;
  }
  .copy-preview {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 8px 10px;
    font-size: 0.72rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.05em;
    line-height: 1.6;
    user-select: all;
    cursor: text;
  }
  .slot-dim    { color: #4A6A80; }
  .slot-active { color: var(--gold-light); }

  .apply-all-btn {
    width: 100%;
    max-width: 320px;
    margin-top: 6px;
    background: linear-gradient(135deg, #1E4A7A, #163560);
    border: 1px solid #4A7AB0;
    color: #FFFFFF;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 700;
    font-size: 0.75rem;
    padding: 9px;
    border-radius: 3px;
    cursor: pointer;
    letter-spacing: 0.08em;
    transition: all 0.15s;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
  }
  .apply-all-btn:hover {
    border-color: #6AACF0;
    background: linear-gradient(135deg, #2A5E9A, #1E4A7A);
  }

  .clock-bar {
    width: 100%;
    max-width: 320px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 8px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
    gap: 8px;
  }
  .clock-left {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .clock-label {
    font-size: 0.6rem;
    color: #6A8AA0;
    letter-spacing: 0.06em;
    white-space: nowrap;
  }
  .game-clock {
    font-size: 1.1rem;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    color: var(--gold);
    letter-spacing: 0.04em;
  }
  .game-clock.running { color: var(--gold-light); }

  .reset-btn {
    width: 100%;
    max-width: 320px;
    margin-top: 5px;
    background: transparent;
    border: 1px solid #3A5068;
    color: #6A8AA0;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 0.62rem;
    font-weight: 700;
    padding: 6px;
    border-radius: 3px;
    cursor: pointer;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    transition: all 0.15s;
  }
  .reset-btn:hover { color: var(--white); border-color: #8AAAC0; }
</style>
</head>
<body>

<div class="header">
  <h1>Flash Tracker</h1>
  <p>점멸 쿨타임 트래커</p>
</div>

<div class="clock-bar" id="clockBar">
  <div class="clock-left">
    <span class="clock-label">경과</span>
    <div class="time-fields">
      <input class="t-input" id="start-hr"  inputmode="numeric" placeholder="00" maxlength="2">
      <span class="t-colon">:</span>
      <input class="t-input" id="start-min" inputmode="numeric" placeholder="00" maxlength="2">
      <span class="t-colon">:</span>
      <input class="t-input" id="start-sec" inputmode="numeric" placeholder="00" maxlength="2">
    </div>
    <button class="confirm-btn" onclick="setGameStart()">시작</button>
  </div>
  <div class="game-clock" id="gameClock">--:--</div>
</div>

<div class="lanes-grid" id="lanesGrid"></div>

<button class="apply-all-btn" onclick="applyAll()">입력</button>

<div class="copy-section">
  <div class="copy-preview" id="copyPreview"></div>
</div>
<button class="reset-btn" onclick="resetAll()">초기화</button>

<script>
const LANES = [
  { id: 'top',    name: '탑',   short: 'top' },
  { id: 'jungle', name: '정글', short: 'jug' },
  { id: 'mid',    name: '미드', short: 'mid' },
  { id: 'adc',    name: '원딜', short: 'ad'  },
  { id: 'sup',    name: '서폿', short: 'sup' },
];

const SA = { boots: 10, upgBoots: 20, utong: 18 };
function calcCd(saTotal) { return Math.floor(300 * 100 / (100 + saTotal)); }
const CD = {
  base:     300,
  boots:    calcCd(SA.boots),
  upgBoots: calcCd(SA.upgBoots),
  utong:    calcCd(SA.utong),
  both:     calcCd(SA.boots + SA.utong),
  upgBoth:  calcCd(SA.upgBoots + SA.utong),
};

const state = {};
LANES.forEach(l => {
  state[l.id] = { boots: false, upgBoots: false, utong: false, usedAt: null, readyAt: null, status: 'idle', realStartAt: null, cdSec: 0 };
});

let gameStartRealMs = null;

function getGameTimeSec() {
  if (gameStartRealMs === null) return null;
  return Math.floor((Date.now() - gameStartRealMs) / 1000);
}

function setGameStart() {
  const h = parseInt(document.getElementById('start-hr').value) || 0;
  const m = parseInt(document.getElementById('start-min').value) || 0;
  const s = Math.min(59, parseInt(document.getElementById('start-sec').value) || 0);
  const offsetSec = h * 3600 + m * 60 + s;
  gameStartRealMs = Date.now() - offsetSec * 1000;
  document.getElementById('gameClock').classList.add('running');
}

function updateGameClock() {
  const sec = getGameTimeSec();
  const el = document.getElementById('gameClock');
  if (sec === null || sec < 0) {
    el.textContent = '--:--';
  } else {
    el.textContent = fmt(sec);
  }
}

function getCd(id) {
  const s = state[id];
  if (s.upgBoots && s.utong) return CD.upgBoth;
  if (s.upgBoots) return CD.upgBoots;
  if (s.boots && s.utong) return CD.both;
  if (s.boots) return CD.boots;
  if (s.utong) return CD.utong;
  return CD.base;
}

function fmt(sec) {
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60).toString().padStart(2, '0');
  const s = (sec % 60).toString().padStart(2, '0');
  if (h > 0) return `${h}:${m}:${s}`;
  return `${m}:${s}`;
}

function getInputSec(laneId) {
  const hVal = parseInt(document.getElementById(`hr-${laneId}`).value) || 0;
  const mVal = parseInt(document.getElementById(`min-${laneId}`).value) || 0;
  const sVal = Math.min(59, parseInt(document.getElementById(`sec-${laneId}`).value) || 0);
  return hVal * 3600 + mVal * 60 + sVal;
}

function hasInput(laneId) {
  const h = document.getElementById(`hr-${laneId}`).value;
  const m = document.getElementById(`min-${laneId}`).value;
  const s = document.getElementById(`sec-${laneId}`).value;
  return h !== '' || m !== '' || s !== '';
}

function applyFlash(laneId) {
  if (!hasInput(laneId)) return;
  const usedAt = getInputSec(laneId);
  const cd = getCd(laneId);
  const ls = state[laneId];
  ls.usedAt = usedAt;
  ls.readyAt = usedAt + cd;
  ls.status = 'cooling';
  ls.realStartAt = Date.now();
  ls.cdSec = cd;
  renderAll();
}

/* 실시간 '지금' 버튼 클릭 시 로직 */
function applyFlashNow(laneId) {
  const currentSec = getGameTimeSec();
  if (currentSec === null || currentSec < 0) {
    alert('경과 시간의 [시작] 버튼을 먼저 눌러주세요!');
    return;
  }
  
  const h = Math.floor(currentSec / 3600);
  const m = Math.floor((currentSec % 3600) / 60);
  const s = currentSec % 60;
  
  // 인풋 창에 현재 게임 시간 대입
  document.getElementById(`hr-${laneId}`).value = String(h).padStart(2, '0');
  document.getElementById(`min-${laneId}`).value = String(m).padStart(2, '0');
  document.getElementById(`sec-${laneId}`).value = String(s).padStart(2, '0');
  
  // 즉시 쿨타임 트래킹 적용
  applyFlash(laneId);
}

function applyAll() {
  LANES.forEach(l => applyFlash(l.id));
}

function cancelFlash(laneId) {
  const ls = state[laneId];
  ls.usedAt = null; ls.readyAt = null; ls.status = 'idle';
  ls.realStartAt = null; ls.cdSec = 0;
  document.getElementById(`hr-${laneId}`).value = '';
  document.getElementById(`min-${laneId}`).value = '';
  document.getElementById(`sec-${laneId}`).value = '';
  renderAll();
}

function resetAll() {
  gameStartRealMs = null;
  document.getElementById('gameClock').textContent = '--:--';
  document.getElementById('gameClock').classList.remove('running');
  document.getElementById('start-hr').value = '';
  document.getElementById('start-min').value = '';
  document.getElementById('start-sec').value = '';
  LANES.forEach(l => {
    state[l.id].boots = false;
    state[l.id].upgBoots = false;
    state[l.id].utong = false;
    state[l.id].usedAt = null;
    state[l.id].readyAt = null;
    state[l.id].status = 'idle';
    state[l.id].realStartAt = null;
    state[l.id].cdSec = 0;
    document.getElementById(`hr-${l.id}`).value = '';
    document.getElementById(`min-${l.id}`).value = '';
    document.getElementById(`sec-${l.id}`).value = '';
    document.getElementById(`pill-${l.id}-boots`).classList.remove('on');
    document.getElementById(`pill-${l.id}-utong`).classList.remove('on');
    const uBtn = document.getElementById(`pill-${l.id}-upgBoots`);
    if (uBtn) uBtn.classList.remove('on');
    updatePillLabels(l.id);
  });
  renderAll();
}

function toggleRune(laneId, rune) {
  const ls = state[laneId];
  if (rune === 'boots' && ls.upgBoots) {
    ls.upgBoots = false;
    document.getElementById(`pill-${laneId}-upgBoots`).classList.remove('on');
  }
  if (rune === 'upgBoots' && ls.boots) {
    ls.boots = false;
    document.getElementById(`pill-${laneId}-boots`).classList.remove('on');
  }
  ls[rune] = !ls[rune];
  document.getElementById(`pill-${laneId}-${rune}`).classList.toggle('on', ls[rune]);
  if (ls.usedAt !== null) ls.readyAt = ls.usedAt + getCd(laneId);
  updatePillLabels(laneId);
  renderAll();
}

function updatePillLabels(laneId) {
  const s = state[laneId];
  const bootsCd = s.utong ? CD.both : CD.boots;
  const utongCd = s.upgBoots ? CD.upgBoth : (s.boots ? CD.both : CD.utong);
  document.getElementById(`pill-${laneId}-boots`).textContent = s.boots ? `장화 ${bootsCd}초` : `장화 ${CD.boots}초`;
  document.getElementById(`pill-${laneId}-utong`).textContent = s.utong ? `우통 ${utongCd}초` : `우통 ${CD.utong}초`;
  const uBtn = document.getElementById(`pill-${laneId}-upgBoots`);
  if (uBtn) {
    const upgCd = s.utong ? CD.upgBoth : CD.upgBoots;
    uBtn.textContent = s.upgBoots ? `업글장화 ${upgCd}초` : `업글장화 ${CD.upgBoots}초`;
  }
}

function renderAll() {
  LANES.forEach(l => renderLane(l));
  renderCopy();
}

function clearLane(laneId) {
  const ls = state[laneId];
  ls.usedAt = null; ls.readyAt = null; ls.status = 'idle';
  ls.realStartAt = null; ls.cdSec = 0;
  document.getElementById(`hr-${laneId}`).value = '';
  document.getElementById(`min-${laneId}`).value = '';
  document.getElementById(`sec-${laneId}`).value = '';
}

function renderLane(lane) {
  const ls = state[lane.id];
  const card      = document.getElementById(`card-${lane.id}`);
  const bar       = document.getElementById(`bar-${lane.id}`);
  const cancelBtn = document.getElementById(`cancel-${lane.id}`);

  if (ls.status === 'cooling') {
    const gameSec = getGameTimeSec();
    if (gameSec !== null && gameSec >= ls.readyAt) {
      clearLane(lane.id);
    } else if (gameSec === null) {
      const elapsed = Math.floor((Date.now() - ls.realStartAt) / 1000);
      if (elapsed >= ls.cdSec) clearLane(lane.id);
    }
  }

  if (ls.status === 'cooling') {
    card.className = 'lane-card cooling';
    bar.style.display = 'block';
    const gameSec = getGameTimeSec();
    let pct = 0;
    if (gameSec !== null && ls.usedAt !== null) {
      pct = Math.min(100, (gameSec - ls.usedAt) / ls.cdSec * 100);
    } else if (ls.realStartAt !== null) {
      pct = Math.min(100, (Date.now() - ls.realStartAt) / 1000 / ls.cdSec * 100);
    }
    bar.querySelector('.progress-bar-fill').style.width = pct.toFixed(1) + '%';
    cancelBtn.classList.add('visible');
  } else {
    card.className = 'lane-card';
    bar.style.display = 'none';
    bar.querySelector('.progress-bar-fill').style.width = '0%';
    cancelBtn.classList.remove('visible');
  }
}

function renderCopy() {
  const preview = document.getElementById('copyPreview');
  const active = LANES
    .filter(l => state[l.id].status !== 'idle')
    .sort((a, b) => state[a.id].readyAt - state[b.id].readyAt);
  if (active.length === 0) {
    preview.innerHTML = '<span class="slot-dim">—</span>';
  } else {
    preview.innerHTML = active.map(l =>
      `<span class="slot-active">${l.short} ${fmt(state[l.id].readyAt)}</span>`
    ).join(' ');
  }
}

function limitInput(el, max) {
  el.addEventListener('input', () => {
    el.value = el.value.replace(/\D/g, '').slice(0, 2);
    if (max !== null && parseInt(el.value) > max) el.value = String(max).padStart(2, '0');
  });
}

function buildLanes() {
  const grid = document.getElementById('lanesGrid');
  LANES.forEach(lane => {
    const card = document.createElement('div');
    card.className = 'lane-card';
    card.id = `card-${lane.id}`;
    card.innerHTML = `
      <div class="lane-top">
        <div class="lane-label">${lane.name}</div>
        <div class="time-fields">
          <input class="t-input" id="hr-${lane.id}"  inputmode="numeric" placeholder="00" maxlength="2">
          <span class="t-colon">:</span>
          <input class="t-input" id="min-${lane.id}" inputmode="numeric" placeholder="00" maxlength="2">
          <span class="t-colon">:</span>
          <input class="t-input" id="sec-${lane.id}" inputmode="numeric" placeholder="00" maxlength="2">
        </div>
        <button class="now-btn" onclick="applyFlashNow('${lane.id}')">지금</button>
        <button class="cancel-btn" id="cancel-${lane.id}" onclick="cancelFlash('${lane.id}')">취소</button>
      </div>
      <div class="lane-bottom">
        <div class="rune-pills">
          <button class="rune-pill" id="pill-${lane.id}-boots" onclick="toggleRune('${lane.id}','boots')">장화 ${CD.boots}초</button>
          ${lane.id === 'mid' ? `<button class="rune-pill" id="pill-${lane.id}-upgBoots" onclick="toggleRune('${lane.id}','upgBoots')">업글장화 ${CD.upgBoots}초</button>` : ''}
          <button class="rune-pill" id="pill-${lane.id}-utong" onclick="toggleRune('${lane.id}','utong')">우통 ${CD.utong}초</button>
        </div>
      </div>
      <div class="progress-bar-wrap" id="bar-${lane.id}">
        <div class="progress-bar-fill"></div>
      </div>
    `;
    grid.appendChild(card);

    setTimeout(() => {
      const hrEl  = document.getElementById(`hr-${lane.id}`);
      const minEl = document.getElementById(`min-${lane.id}`);
      const secEl = document.getElementById(`sec-${lane.id}`);
      limitInput(hrEl, 99);
      limitInput(minEl, 59);
      limitInput(secEl, 59);
      hrEl.addEventListener('keydown',  e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); minEl.focus(); } });
      minEl.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); secEl.focus(); } });
      secEl.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); applyAll(); } });
      hrEl.addEventListener('input',  () => { if (hrEl.value.length  === 2) minEl.focus(); });
      minEl.addEventListener('input', () => { if (minEl.value.length === 2) secEl.focus(); });
    }, 0);
  });
}

buildLanes();
renderAll();

setTimeout(() => {
  const sHr  = document.getElementById('start-hr');
  const sMin = document.getElementById('start-min');
  const sSec = document.getElementById('start-sec');
  limitInput(sHr,  23);
  limitInput(sMin, 59);
  limitInput(sSec, 59);
  sHr.addEventListener('input',  () => { if (sHr.value.length  === 2) sMin.focus(); });
  sMin.addEventListener('input', () => { if (sMin.value.length === 2) sSec.focus(); });
  sHr.addEventListener('keydown',  e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); sMin.focus(); } });
  sMin.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); sSec.focus(); } });
  sSec.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setGameStart(); } });
}, 0);

setInterval(() => {
  updateGameClock();
  renderAll();
}, 1000);
</script>

</body>
</html>
